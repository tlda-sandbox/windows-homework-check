name: Windows handout check

# What this exercises, and what it does not.
#
# It downloads the PUBLIC student handout zips exactly as a student does,
# extracts them, and renders each handout with local R on a GitHub-hosted
# Windows runner (windows-latest). It records, per handout: the extraction
# nesting, the project configuration, the working directory R sees, whether
# data/*.csv resolves, whether with_seed() runs, and the full render output
# (uploaded as the render-log artifact).
#
# It does NOT exercise interactive Positron. Batch rendering and the IDE are
# different execution modes; a Positron proof still needs a desktop run on
# Windows. This repo only answers the batch-render question.
#
# Re-run: Actions -> "Windows handout check" -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-render:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Download the published student handouts
        run: |
          $base = "https://qtm285.github.io/static/book/homework/handouts"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE/work" | Out-Null
          foreach ($hw in @("homework-setup-handout.zip", "homework-descriptive-handout.zip", "homework-calibration-handout.zip", "homework-calibration-binary-handout.zip", "homework-bootstrap-handout.zip", "homework-random-variables-and-moments-handout.zip", "homework-comparing-estimators-handout.zip")) {
            Invoke-WebRequest -Uri "$base/$hw" -OutFile "$env:GITHUB_WORKSPACE/work/$hw"
          }
          Get-ChildItem "$env:GITHUB_WORKSPACE/work" | Select-Object Name, Length | Format-Table

      - name: Extract and record the nesting
        run: |
          $root = $env:GITHUB_WORKSPACE
          foreach ($zip in Get-ChildItem "$root/work/*.zip") {
            $dest = Join-Path "$root/extract" $zip.BaseName
            Expand-Archive -Path $zip.FullName -DestinationPath $dest -Force
          }
          $tree = Get-ChildItem "$root/extract" -Recurse -Depth 3 | ForEach-Object { $_.FullName.Substring($root.Length + 1) }
          $tree | Out-File -Encoding utf8 "$root/extract-tree.txt"
          $tree

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install the R packages the handouts load
        run: |
          Rscript -e "install.packages(c('tidyverse', 'gt', 'htmltools', 'kableExtra', 'knitr', 'rmarkdown', 'scales'), repos = 'https://cloud.r-project.org')"

      - name: Render each handout from its extracted folder
        run: |
          $root = $env:GITHUB_WORKSPACE
          $log = "$root/render-log.txt"
          "Windows handout check - $(Get-Date -Format o)" | Set-Content -Encoding utf8 $log
          (& Rscript -e "cat(R.version.string)") 2>&1 | Add-Content $log
          (& quarto --version) 2>&1 | Add-Content $log
          $fail = 0
          $ok = 0
          # Deterministic: for each zip, render exactly the .qmd named after it.
          # Not a recursive .qmd sweep -- that renders includes like ga-turnout.qmd
          # standalone, which fails by design, and it silently missed
          # homework-setup whose zip ships no _quarto.yml.
          foreach ($zip in Get-ChildItem "$root/work/*.zip")  {
            $base = $zip.BaseName -replace '-handout$', ''
            $target = Get-ChildItem "$root/extract/$($zip.BaseName)" -Recurse -Filter "$base.qmd" | Select-Object -First 1
            if (-not $target) { "MISSING HANDOUT QMD: expected $base.qmd inside $($zip.Name)" | Add-Content $log; $fail = 1; continue }
            $dir = $target.Directory
            $hasProject = Test-Path (Join-Path $dir.FullName "_quarto.yml")
            "=== HANDOUT $base  (project file: $hasProject) ===" | Add-Content $log
            Push-Location $dir.FullName
            (Get-ChildItem -Name) | Add-Content $log
            "--- quarto render $($target.Name) ---" | Add-Content $log
            (& quarto render $target.Name) 2>&1 | Add-Content $log
            $code = $LASTEXITCODE
            "--- exit code: $code ($base) ---" | Add-Content $log
            if ($code -ne 0) { $fail = 1; "RENDER FAILED: $base" | Add-Content $log } else { $ok++ }
            Pop-Location
          }
          "handouts rendered ok: $ok" | Add-Content $log
          "===== render-log.txt ====="
          Get-Content $log
          Set-Content -Encoding utf8 "$root/render-status.txt" "fail=$fail ok=$ok"
          exit $fail

      - name: Upload logs and tree
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-logs
          path: |
            render-log.txt
            render-status.txt
            extract-tree.txt
