name: Windows Positron check

# Bounded experiment: can the ACTUAL Positron IDE run and be reached on this
# hosted windows-latest runner? It measures, in order:
#   1. the runner's real session shape (interactive desktop or service session);
#   2. Positron 2026.10.0-297 x64 installed silently, R present;
#   3. the actual public handout zip extracted;
#   4. Positron launched on the extracted folder with the same isolation +
#      debug-port flags that work on the Mac seat;
#   5. whether its Electron debug port answers, and what the workbench DOM says
#      over CDP (Target.attachToTarget, Runtime.evaluate);
#   6. whether an R kernel process (ark / kallichore) ever appears;
#   7. Positron's own logs.
# Every step is bounded and every failure prints where it stopped; artifacts
# carry all logs. This does not touch the batch handout workflow.

on:
  workflow_dispatch:

jobs:
  positron:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Session facts
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $env:GITHUB_WORKSPACE
          $log = "$root/session-facts.txt"
          "runner session facts - $(Get-Date -Format o)" | Set-Content -Encoding utf8 $log
          "whoami: $(whoami)" | Add-Content $log
          "user interactive: $([Environment]::UserInteractive)" | Add-Content $log
          "this process session id: $((Get-Process -Id $PID).SessionId)" | Add-Content $log
          "query session output:" | Add-Content $log
          (query session 2>&1) | Add-Content $log
          "explorer processes: $((Get-Process explorer -ErrorAction SilentlyContinue | Measure-Object).Count)" | Add-Content $log
          "conhost processes: $((Get-Process conhost -ErrorAction SilentlyContinue | Measure-Object).Count)" | Add-Content $log
          "R on PATH: $((Get-Command R.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source) -join ', ')" | Add-Content $log
          Get-Content $log
          exit 0

      - uses: r-lib/actions/setup-r@v2
        if: always()
        with:
          r-version: 'release'

      - name: Download and install Positron
        if: always()
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          $root = $env:GITHUB_WORKSPACE
          $log = "$root/positron-install.txt"
          $url = "https://cdn.posit.co/positron/releases/win/x86_64/Positron-2026.10.0-297-UserSetup-x64.exe"
          $exe = "$root/Positron-setup.exe"
          "downloading $url" | Set-Content -Encoding utf8 $log
          Invoke-WebRequest -Uri $url -OutFile $exe
          "downloaded bytes: $((Get-Item $exe).Length)" | Add-Content $log
          $sevenZip = @("$env:ProgramFiles\7-Zip\7z.exe", "C:\Program Files\7-Zip\7z.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          "7z: $sevenZip" | Add-Content $log
          $found = @()
          if ($sevenZip) {
            # 1. What IS this installer? Log the archive listing (format + contents).
            "--- 7z listing (first 60 lines) ---" | Add-Content $log
            (& $sevenZip l $exe 2>&1 | Select-Object -First 60) | Add-Content $log
            "--- extraction ---" | Add-Content $log
            $stage1 = "$root/positron-stage1"
            $stage2 = "$root/positron-app"
            (& $sevenZip x $exe "-o$stage1" -y 2>&1 | Select-Object -Last 5) | Add-Content $log
            "stage1 top-level:" | Add-Content $log
            (Get-ChildItem $stage1 -ErrorAction SilentlyContinue | Select-Object -First 20 -ExpandProperty Name) | Add-Content $log
            # 2. Any nested archives (NSIS app-64.7z or similar) get one more extraction.
            $inners = @(Get-ChildItem -Path $stage1 -Recurse -Include '*.7z', '*.zip' -ErrorAction SilentlyContinue | Select-Object -First 5)
            foreach ($inner in $inners) {
              "inner archive: $($inner.FullName)" | Add-Content $log
              & $sevenZip x $inner.FullName "-o$stage2" -y | Out-Null
            }
            # 3. Search every stage for the exe.
            $found = @(Get-ChildItem -Path $stage1, $stage2 -Recurse -Filter 'Positron.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName)
          }
          if (-not $found) {
            "no exe from extraction; trying NSIS silent flags (bounded)" | Add-Content $log
            $proc = Start-Process -FilePath $exe -ArgumentList '/S' -PassThru
            if (-not $proc.WaitForExit(300000)) {
              "NSIS silent run still alive after 5 min - killing" | Add-Content $log
              try { Stop-Process -Id $proc.Id -Force } catch { }
            } else {
              "installer exit code: $($proc.ExitCode)" | Add-Content $log
            }
            $found = @("$env:LOCALAPPDATA\Programs\Positron\Positron.exe", "$env:ProgramFiles\Positron\Positron.exe") | Where-Object { Test-Path $_ }
          }
          if (-not $found) {
            "still nothing; trying Inno Setup silent flags (bounded, current-user)" | Add-Content $log
            $proc = Start-Process -FilePath $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER' -PassThru
            if (-not $proc.WaitForExit(300000)) {
              "Inno silent run still alive after 5 min - killing" | Add-Content $log
              try { Stop-Process -Id $proc.Id -Force } catch { }
            } else {
              "installer exit code: $($proc.ExitCode)" | Add-Content $log
            }
            $found = @("$env:LOCALAPPDATA\Programs\Positron\Positron.exe", "$env:ProgramFiles\Positron\Positron.exe") | Where-Object { Test-Path $_ }
          }
          Get-Process | Where-Object { $_.ProcessName -match 'Positron-setup' } | ForEach-Object { try { Stop-Process -Id $_.Id -Force } catch { } }
          "positron exe: $($found -join ', ')" | Add-Content $log
          if (-not $found) { "POSITRON EXE MISSING - the launch step cannot proceed" | Add-Content $log }
          "POSITRON_EXE=$($found | Select-Object -First 1)" | Add-Content -Path $env:GITHUB_ENV -Encoding utf8
          Get-Content $log
          exit 0

      - name: Download and extract the public handouts
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $env:GITHUB_WORKSPACE
          $base = "https://qtm285.github.io/static/book/homework/handouts"
          New-Item -ItemType Directory -Force "$root/work" | Out-Null
          foreach ($hw in @("homework-comparing-estimators-handout.zip", "homework-random-variables-and-moments-handout.zip")) {
            Invoke-WebRequest -Uri "$base/$hw" -OutFile "$root/work/$hw"
            $dest = Join-Path "$root/extract" ($hw -replace '\.zip$', '')
            Expand-Archive -Path "$root/work/$hw" -DestinationPath $dest -Force
          }
          (Get-ChildItem "$root/extract" -Recurse -Depth 2 | ForEach-Object { $_.FullName.Substring($root.Length + 1) }) | Out-File -Encoding utf8 "$root/extract-tree.txt"
          Get-ChildItem "$root/work" | Select-Object Name, Length | Format-Table

      - name: Launch Positron on the extracted HW5 folder
        if: always()
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $env:GITHUB_WORKSPACE
          $log = "$root/positron-run.txt"
          "launch - $(Get-Date -Format o)" | Set-Content -Encoding utf8 $log
          $exe = $env:POSITRON_EXE
          "exe: $exe" | Add-Content $log
          $folder = "$root/extract/homework-comparing-estimators-handout/homework-comparing-estimators"
          "folder exists: $(Test-Path $folder)" | Add-Content $log
          $iso = "$root/positron-iso"
          New-Item -ItemType Directory -Force "$iso/user", "$iso/ext", "$iso/shared" | Out-Null
          $argList = @(
            "--user-data-dir=$iso\user", "--extensions-dir=$iso\ext", "--shared-data-dir=$iso\shared",
            "--remote-debugging-port=9222", "--no-sandbox", "--new-window", "--disable-workspace-trust", $folder
          )
          $proc = Start-Process -FilePath $exe -ArgumentList $argList -PassThru
          "launched pid $($proc.Id)" | Add-Content $log
          $reachable = $false
          for ($i = 1; $i -le 45; $i++) {
            Start-Sleep -Seconds 2
            try {
              $v = Invoke-RestMethod -Uri "http://127.0.0.1:9222/json/version" -TimeoutSec 3
              "CDP answered after $($i * 2)s: $($v | ConvertTo-Json -Compress)" | Add-Content $log
              $reachable = $true
              break
            } catch { }
            if ($proc.HasExited) {
              "positron process exited after $($i * 2)s, code $($proc.ExitCode)" | Add-Content $log
              break
            }
          }
          if (-not $reachable) { "CDP never answered within the bound" | Add-Content $log }
          "positron-family processes:" | Add-Content $log
          ((Get-Process | Where-Object { $_.ProcessName -match 'positron' } | Select-Object Id, ProcessName, SessionId, WorkingSet | Format-Table | Out-String).Trim()) | Add-Content $log
          "kernel candidates (ark/kallichore/kcserver/Rterm):" | Add-Content $log
          ((Get-Process ark, kallichore, kcserver, Rterm -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, SessionId | Format-Table | Out-String).Trim()) | Add-Content $log
          Get-Content $log
          exit 0

      - name: Attach over CDP and read the workbench
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $env:GITHUB_WORKSPACE
          npm install ws --no-save --silent --prefix $root | Out-Null
          $log = "$root/cdp-output.txt"
          "cdp session - $(Get-Date -Format o)" | Set-Content -Encoding utf8 $log
          "node: $(node --version)" | Add-Content $log
          $steps = @(
            @('targets'),
            @('eval', 'document.title'),
            @('eval', "[...document.querySelectorAll('.tab')].map(t=>t.textContent.trim()).join(' | ')"),
            @('console'),
            @('inputstate')
          )
          foreach ($s in $steps) {
            "=== drive $($s -join ' ') ===" | Add-Content $log
            (node "$root/positron-drive.mjs" 9222 @s 2>&1) | Add-Content $log
            "exit: $LASTEXITCODE" | Add-Content $log
          }
          Get-Content $log
          exit 0

      - name: Start the R session and probe the console
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $env:GITHUB_WORKSPACE
          $d = "$root/positron-drive.mjs"
          $log = "$root/session-start.txt"
          "session start - $(Get-Date -Format o)" | Set-Content -Encoding utf8 $log
          $attempts = @(
            @('clicktext', 'Start Session'),
            @('inputstate'),
            @('clicktext', 'Start Session'),
            @('inputstate'),
            @('pick', 'R 4'),
            @('r', 'cat("ZZ", getwd(), exists("with_seed"), "\n")'),
            @('console')
          )
          foreach ($s in $attempts) {
            "=== drive $($s -join ' ') ===" | Add-Content $log
            (node $d 9222 @s 2>&1) | Add-Content $log
            "exit: $LASTEXITCODE" | Add-Content $log
            Start-Sleep -Seconds 4
          }
          "kernel candidates after the attempt:" | Add-Content $log
          ((Get-Process ark, kallichore, kcserver, Rterm -ErrorAction SilentlyContinue | Select-Object Id, ProcessName, SessionId | Format-Table | Out-String).Trim()) | Add-Content $log
          "positron console panel text:" | Add-Content $log
          (node $d 9222 console 2>&1) | Add-Content $log
          Get-Content $log
          exit 0

      - name: Collect Positron logs
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          $root = $env:GITHUB_WORKSPACE
          $dest = "$root/positron-logs"
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($candidate in @("$env:APPDATA\Positron", "$env:USERPROFILE\.positron", "$env:USERPROFILE\.positron-shared", "$root/positron-iso/user/logs")) {
            if (Test-Path $candidate) {
              "copying $candidate" | Out-File -Append -Encoding utf8 "$root/log-collection.txt"
              Copy-Item -Recurse -Force $candidate "$dest" -ErrorAction SilentlyContinue
            } else {
            "absent: $candidate" | Out-File -Append -Encoding utf8 "$root/log-collection.txt"
            }
          }
          Get-ChildItem -Recurse $dest -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '\.log$' } | Select-Object -First 40 FullName, Length | Format-Table | Out-File -Append -Encoding utf8 "$root/log-collection.txt"
          Get-Content "$root/log-collection.txt"
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: positron-check-evidence
          path: |
            session-facts.txt
            positron-install.txt
            positron-run.txt
            cdp-output.txt
            session-start.txt
            extract-tree.txt
            log-collection.txt
            positron-logs
