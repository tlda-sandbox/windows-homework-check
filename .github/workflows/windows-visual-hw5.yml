name: Windows HW5 visual mode

on:
  workflow_dispatch:
    inputs:
      site:
        description: Course publication to download
        type: choice
        options: [live, test-live]
        default: live
      open_mode:
        description: Normal Positron opening action to check
        type: choice
        options: [file, folder]
        default: file

jobs:
  visual:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Install course packages
        run: |
          Rscript -e "install.packages(c('tidyverse','gt','htmltools','kableExtra','knitr','rmarkdown','scales'), repos='https://cloud.r-project.org'); stopifnot(all(vapply(c('tidyverse','gt','htmltools','kableExtra','knitr','rmarkdown','scales'), requireNamespace, logical(1), quietly=TRUE)))"
          if ($LASTEXITCODE) { throw 'Course package installation failed' }
      - name: Install Windows Positron and Quarto extension
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://cdn.posit.co/positron/releases/win/x86_64/Positron-2026.10.0-297-UserSetup-x64.exe' -OutFile setup.exe
          $p = Start-Process ./setup.exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER' -PassThru
          if (!$p.WaitForExit(300000) -or $p.ExitCode -ne 0) { throw 'Positron installation failed' }
          $exe = "$env:LOCALAPPDATA\Programs\Positron\Positron.exe"
          if (!(Test-Path $exe)) { throw "Positron missing: $exe" }
          "POSITRON_EXE=$exe" | Add-Content $env:GITHUB_ENV
          New-Item -ItemType Directory -Force evidence, iso/user, iso/ext, iso/shared | Out-Null
          & "$env:LOCALAPPDATA\Programs\Positron\bin\positron.cmd" --user-data-dir="$pwd/iso/user" --extensions-dir="$pwd/iso/ext" --install-extension quarto.quarto --force
          if ($LASTEXITCODE) { throw 'Quarto extension installation failed' }
      - name: Download HW5 exactly from the live course
        env:
          CHECK_SITE: ${{ inputs.site }}
        run: |
          $ErrorActionPreference = 'Stop'
          $prefix = if ($env:CHECK_SITE -eq 'test-live') { 'https://qtm285.github.io/pages-topology-test' } else { 'https://qtm285.github.io' }
          $url = "$prefix/static/book/homework/handouts/homework-comparing-estimators-handout.zip"
          Invoke-WebRequest $url -OutFile hw5.zip
          "$url`n$((Get-FileHash hw5.zip -Algorithm SHA256).Hash)" | Set-Content evidence/download.txt
          Expand-Archive hw5.zip -DestinationPath extract
          Get-ChildItem extract -Recurse -File | ForEach-Object { "$($_.FullName) $((Get-FileHash $_.FullName -Algorithm SHA256).Hash)" } | Set-Content evidence/members-before.txt
          Copy-Item extract/homework-comparing-estimators/homework-comparing-estimators.qmd evidence/downloaded.qmd
      - name: Vanilla open in visual mode, then run all cells
        timeout-minutes: 12
        env:
          CHECK_OPEN_MODE: ${{ inputs.open_mode }}
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = "$pwd/extract/homework-comparing-estimators"
          $qmd = "$folder/homework-comparing-estimators.qmd"
          $before = (Get-FileHash $qmd).Hash
          $launch = @("--user-data-dir=$pwd/iso/user", "--extensions-dir=$pwd/iso/ext", "--shared-data-dir=$pwd/iso/shared", '--remote-debugging-port=9222', '--new-window', '--disable-workspace-trust', $qmd)
          if ($env:CHECK_OPEN_MODE -eq 'folder') { $launch += $folder }
          "Opening mode: $env:CHECK_OPEN_MODE" | Set-Content evidence/open-mode.txt
          Start-Process $env:POSITRON_EXE -ArgumentList $launch
          $ready = $false
          for ($i=0; $i -lt 60; $i++) {
            try { Invoke-RestMethod http://127.0.0.1:9222/json/version | ConvertTo-Json | Set-Content evidence/ide-version.json; $ready=$true; break } catch { Start-Sleep 2 }
          }
          if (!$ready) { throw 'Windows Positron did not start' }
          npm install ws --no-save --silent
          function Drive([string[]] $a) {
            $out = & node positron-drive.mjs 9222 @a 2>&1
            $rc = $LASTEXITCODE
            $out | Tee-Object -Append evidence/visual-run.txt
            if ($rc) { throw "IDE driver failed ($rc): $($a -join ' ')" }
          }
          Start-Sleep 15
          Drive @('command','Quarto: Edit in Visual Mode')
          Start-Sleep 15
          Drive @('eval', 'document.body.innerText')
          Drive @('eval', 'JSON.stringify([...document.querySelectorAll("iframe")].map(x=>({title:x.title,src:x.src})))')
          Drive @('screenshot','evidence/visual-before.png')
          Drive @('requireexpr', 'document.querySelectorAll("iframe").length > 0', '45')
          Drive @('visual-code')
          Drive @('screenshot','evidence/visual-r-block.png')
          Drive @('command','Quarto: Run All Cells')
          for ($i=0; $i -lt 1; $i++) {
            Start-Sleep 30
            Drive @('console')
          }
          Drive @('screenshot','evidence/visual-after.png')
          Drive @('command','Focus Console')
          Drive @('r', 'cat("HW5_COMPLETION:", exists("with_seed") && is.function(with_seed) && exists("width_binom") && is.function(width_binom) && exists("class.theme") && inherits(class.theme, "theme") && exists("simplified.theme"), "\n")')
          Drive @('requireexpr', 'document.getElementById("workbench.panel.positronConsole")?.textContent.includes("HW5_COMPLETION: TRUE")', '90')
          Drive @('console')
          Drive @('screenshot','evidence/console-completion.png')
          Copy-Item $qmd evidence/after-visual.qmd
          "Before: $before`nAfter: $((Get-FileHash $qmd).Hash)" | Set-Content evidence/editor-hashes.txt
          & git diff --no-index -- evidence/downloaded.qmd evidence/after-visual.qmd | Set-Content evidence/editor-save.diff
          if ($LASTEXITCODE -gt 1) { throw 'Could not record the visual editor save diff' }
          $record = Get-Content evidence/visual-run.txt -Raw
          if ($record -notmatch 'HW5_COMPLETION: TRUE') { throw 'The actual IDE run did not reach the final HW5 block' }
          Drive @('visual-eval', 'JSON.stringify({headings:[...document.querySelectorAll("h1,h2,h3")].map(e=>e.textContent), images:[...document.images].map(e=>({src:e.src,complete:e.complete,width:e.naturalWidth,height:e.naturalHeight})), code:[...document.querySelectorAll(".cm-editor")].map(e=>e.innerText), mathErrors:[...document.querySelectorAll(".katex-error,merror")].map(e=>e.textContent)})')
          Drive @('visual-eval', '(async()=>{const e=[...document.querySelectorAll("h1,h2,h3")].find(e=>e.textContent.includes("Review: Prior-Based Estimators")); if(!e) throw Error("Review heading missing"); e.scrollIntoView(); await new Promise(r=>setTimeout(r,1000)); return e.textContent})()')
          Drive @('screenshot','evidence/visual-prior-math.png')
          Drive @('visual-eval', '(async()=>{const e=[...document.images].find(e=>e.src.includes("plot-bias-variance-grid")); if(!e || !e.complete || !e.naturalWidth) throw Error("Given grid image missing"); e.scrollIntoView({block:"center"}); await new Promise(r=>setTimeout(r,1000)); return {src:e.src,width:e.naturalWidth}})()')
          Drive @('screenshot','evidence/visual-given-grid.png')
          Drive @('visual-eval', '(async()=>{const e=[...document.images].find(e=>e.src.includes("plot-convergence-in-probability")); if(!e || !e.complete || !e.naturalWidth) throw Error("Convergence image missing"); e.scrollIntoView({block:"center"}); await new Promise(r=>setTimeout(r,1000)); return {src:e.src,width:e.naturalWidth}})()')
          Drive @('screenshot','evidence/visual-convergence.png')
          Drive @('command','Quarto: Render Document')
          $html = "$folder/homework-comparing-estimators.html"
          $rendered = $false
          for ($i=0; $i -lt 90; $i++) {
            if ((Test-Path $html) -and (Get-Item $html).Length -gt 10000) { $rendered=$true; break }
            Start-Sleep 2
          }
          Drive @('eval','document.body.innerText')
          Drive @('screenshot','evidence/ordinary-render.png')
          if (!$rendered) { throw 'Ordinary Positron Render Document did not produce HW5 HTML' }
          Copy-Item $html evidence/windows-rendered.html
      - name: Collect IDE logs
        if: always()
        run: |
          if (Test-Path iso/user/logs) { Copy-Item iso/user/logs evidence/logs -Recurse }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-hw5-visual-evidence
          path: evidence/
